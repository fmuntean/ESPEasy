[MFD]
#lib_deps = ${esp8266_4M1M.lib_deps}
lib_deps_core =  Wire
                SPI
                PubSubClient
                I2Cdevlib-Core
                ESP8266HTTPUpdateServer
                DNSServer
                ESPeasySerial
                Ticker
                RTClib
                Regexp
                ESP8266HTTPClient
lib_deps =  ${MFD.lib_deps_core}
            ArduinoJson
            HLW8012
            ccronexpr


lib_ignore   = ${esp82xx_common.lib_ignore}, MX3166
lib_ignore_always = MX3166
                    Adafruit TSL2591 Library
                    Adafruit HMC5883 Unified
                    Adafruit Motor Shield V2 Library
                    Adafruit NeoPixel
                    Adafruit Unified Sensor
                    Adafruit BME680 Library
                    Adafruit MPR121
                    Adafruit SGP30 Sensor
                    Adafruit SI1145 Library
                    Adafruit TCS34725
                    Adafruit_ST77xx
                    Adafruit ILI9341 ESPEasy
                    Adafruit PCD8544 Nokia 5110 LCD library
                    ESP8266_SSD1306
                    Itho
                    AM2320
                    AS_BH1750
                    SerialSensors
                    MFRC522
                    NewPingESP8266
                    PZEM-004T-v30
                    MechInputs
                    SDM
                    TinyGPSPlus
                    WakeOnLan
                    Blynk
                    RN2xx3 Arduino Library
                    SD(esp8266)
                    Servo(esp8266)
                    ArduinoOTA
                    CHT16K33 LED Matrix Library
                    LiquidCrystal_I2C
                    MD_MAX72XX
                    MD_Parola
                    SparkFun APDS9960 RGB and Gesture Sensor
                    SparkFun_AS7265x
                    SparkFun VL53L1X 4m Laser Distance Sensor
                    SparkFun MAX1704x Fuel Gauge Arduino Library
                    SparkFun ADXL345 Arduino Library
                    XPT2046_Touchscreen
                    FrogmoreScd30
                    Multi Channel Relay Arduino Library
                    ShiftRegister74HC595_NonTemplate
                    RAK12019_LTR390_UV_Light
                    LOLIN_EPD
                    VL53L0X
                    ITG3205
                    NeoPixelBus
                    Adafruit BusIO
                    Adafruit GFX Library
                    Adafruit ILI9341
                    RABurton ESP8266 Mutex
                    HLW8012
                    
lib_ignore_for_prod   = ${esp82xx_common.lib_ignore}
                        ${MFD.lib_ignore_always}
                    
lib_ignore_for_minimal   = ${esp82xx_common.lib_ignore}
                    ${MFD.lib_ignore_for_prod}
                    ESP8266mDNS

;build_flags  = ${core_2_6_1.build_flags} -D USE_CUSTOM_H
;platform     = ${core_2_6_1.platform}
build_flags  = ${regular_platform.build_flags}
                 -D WEBSERVER_NEW_UI
                 -D USE_CUSTOM_H
platform     = ${regular_platform.platform}
platform_packages         = ${regular_platform.platform_packages}
extra_scripts             = ${extra_scripts_esp8266.extra_scripts}
                            post:post_build.py
monitor_speed_boot      =  74880 ;ESP8266 boot speed
monitor_speed_default   = 115200 ;ESP8266 default speed

;core_2_4_2 the buzzer does not seem to work

[MFD_ESP8266]
extends          = esp8266_4M1M ;esp82xx_common
platform         = ${MFD.platform}
lib_deps         = ${MFD.lib_deps}
lib_ignore       = ${MFD.lib_ignore_for_prod}
lib_ldf_mode     = ${env.lib_ldf_mode}
framework        = ${common.framework}
upload_speed     = ${common.upload_speed}
board            = esp12e
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_flags      = ${MFD.build_flags} 
                   ${esp8266_4M1M.build_flags} 
                   -D PLUGIN_BUILD_CUSTOM
platform_packages = ${regular_platform.platform_packages}
extra_scripts    = ${esp8266_4M1M.extra_scripts}
                   post:post_build.py


